name: Build FrameControl Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate Project and Build Debug APK
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: settings.gradle.kts not found in repository!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameControl-Overlay-v2-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
